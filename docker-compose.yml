# Docker Compose — E-commerce Microservice Platform
# Run: docker compose up --build

services:
  # ─── Databases (Separate per Service) ───────────────────
  postgres-auth:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: changeme
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d auth_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  postgres-product:
    image: postgres:15-alpine
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: product_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: changeme
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d product_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  postgres-cart:
    image: postgres:15-alpine
    ports:
      - "5434:5432"
    environment:
      POSTGRES_DB: cart_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: changeme
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d cart_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  postgres-order:
    image: postgres:15-alpine
    ports:
      - "5435:5432"
    environment:
      POSTGRES_DB: order_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: changeme
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d order_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  postgres-payment:
    image: postgres:15-alpine
    ports:
      - "5436:5432"
    environment:
      POSTGRES_DB: payment_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: changeme
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d payment_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  postgres-notification:
    image: postgres:15-alpine
    ports:
      - "5437:5432"
    environment:
      POSTGRES_DB: notification_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: changeme
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d notification_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  postgres-review:
    image: postgres:15-alpine
    ports:
      - "5438:5432"
    environment:
      POSTGRES_DB: review_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: changeme
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d review_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  # ─── Shared Infrastructure ─────────────────────────────
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 5

  # ─── Services ───────────────────────────────────
  auth-service:
    build: ./services/auth-service
    ports:
      - "8001:8000"
    environment:
      - DB_HOST=postgres-auth
      - DB_NAME=auth_db
      - DB_USER=admin
      - DB_PASSWORD=changeme
      - RABBITMQ_HOST=rabbitmq
    depends_on:
      postgres-auth:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - app-network

  product-service:
    build: ./services/product-service
    ports:
      - "8002:8000"
    environment:
      - DB_HOST=postgres-product
      - DB_NAME=product_db
      - DB_USER=admin
      - DB_PASSWORD=changeme
      - REDIS_HOST=redis
      - RABBITMQ_HOST=rabbitmq
    depends_on:
      postgres-product:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - app-network

  cart-service:
    build: ./services/cart-service
    ports:
      - "8003:8000"
    environment:
      - DB_HOST=postgres-cart
      - DB_NAME=cart_db
      - DB_USER=admin
      - DB_PASSWORD=changeme
      - REDIS_HOST=redis
    depends_on:
      postgres-cart:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-network

  order-service:
    build: ./services/order-service
    ports:
      - "8004:8000"
    environment:
      - DB_HOST=postgres-order
      - DB_NAME=order_db
      - DB_USER=admin
      - DB_PASSWORD=changeme
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=guest
      - RABBITMQ_PASSWORD=guest
      - REDIS_HOST=redis
      - PRODUCT_SERVICE_URL=http://product-service:8000
    depends_on:
      postgres-order:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-network

  # DLX consumer — runs alongside order-service
  order-dlx-consumer:
    build: ./services/order-service
    command: python manage.py consume_expired_orders
    restart: on-failure
    environment:
      - DB_HOST=postgres-order
      - DB_NAME=order_db
      - DB_USER=admin
      - DB_PASSWORD=changeme
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=guest
      - RABBITMQ_PASSWORD=guest
      - REDIS_HOST=redis
      - PRODUCT_SERVICE_URL=http://product-service:8000
    depends_on:
      postgres-order:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - app-network

  # Consumer for order.completed event — runs alongside order-service
  order-completed-consumer:
    build: ./services/order-service
    command: python manage.py consume_completed_orders
    restart: on-failure
    environment:
      - DB_HOST=postgres-order
      - DB_NAME=order_db
      - DB_USER=admin
      - DB_PASSWORD=changeme
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=guest
      - RABBITMQ_PASSWORD=guest
      - REDIS_HOST=redis
      - PRODUCT_SERVICE_URL=http://product-service:8000
    depends_on:
      postgres-order:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - app-network

  payment-service:
    build: ./services/payment-service
    ports:
      - "8005:8000"
    env_file:
      - .env
    environment:
      - DB_HOST=postgres-payment
      - DB_NAME=payment_db
      - DB_USER=admin
      - DB_PASSWORD=changeme
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=guest
      - RABBITMQ_PASSWORD=guest
      - ORDER_SERVICE_URL=http://order-service:8000
    depends_on:
      postgres-payment:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - app-network

  notification-service:
    build: ./services/notification-service
    ports:
      - "8006:8000"
    env_file:
      - .env
    environment:
      - DB_HOST=postgres-notification
      - DB_NAME=notification_db
      - DB_USER=admin
      - DB_PASSWORD=changeme
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=guest
      - RABBITMQ_PASSWORD=guest
    depends_on:
      postgres-notification:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - app-network

  # Notification consumer
  notification-consumer:
    build: ./services/notification-service
    command: python manage.py consume_notifications
    restart: on-failure
    env_file:
      - .env
    environment:
      - DB_HOST=postgres-notification
      - DB_NAME=notification_db
      - DB_USER=admin
      - DB_PASSWORD=changeme
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=guest
      - RABBITMQ_PASSWORD=guest
    depends_on:
      postgres-notification:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - app-network

  review-service:
    build: ./services/review-service
    ports:
      - "8007:8000"
    environment:
      - DB_HOST=postgres-review
      - DB_NAME=review_db
      - DB_USER=admin
      - DB_PASSWORD=changeme
      - PRODUCT_SERVICE_URL=http://product-service:8000
    depends_on:
      postgres-review:
        condition: service_healthy
    networks:
      - app-network

  ai-service:
    build: ./services/ai-service
    ports:
      - "8008:8000"
    environment:
      - PRODUCT_SERVICE_URL=http://product-service:8000
      - ORDER_SERVICE_URL=http://order-service:8000
      - REVIEW_SERVICE_URL=http://review-service:8000
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=2
      - DATA_DIR=/app/data
      - NEO4J_URI=bolt://neo4j-ai:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=neo4jpassword
    volumes:
      - ai_models:/app/data/models
      - ai_chromadb:/app/data/chromadb
    depends_on:
      product-service:
        condition: service_started
      redis:
        condition: service_healthy
      neo4j-ai:
        condition: service_healthy
    networks:
      - app-network

  neo4j-ai:
    image: neo4j:5-community
    ports:
      - "7475:7474"
      - "7688:7687"
    environment:
      NEO4J_AUTH: neo4j/neo4jpassword
      NEO4J_PLUGINS: '[]'
    healthcheck:
      test: ["CMD", "neo4j", "status"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    volumes:
      - neo4j_ai_data:/data
    networks:
      - app-network

  # ─── AI New Service (RNN/LSTM/BiLSTM + Neo4j + RAG) ──
  postgres-ai-new:
    image: postgres:15-alpine
    ports:
      - "5439:5432"
    environment:
      POSTGRES_DB: ai_new_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: changeme
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d ai_new_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  neo4j:
    image: neo4j:5-community
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/neo4jpassword
      NEO4J_PLUGINS: '[]'
    healthcheck:
      test: ["CMD", "neo4j", "status"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    volumes:
      - neo4j_data:/data
    networks:
      - app-network

  ai-new-service:
    build: ./services/ai-new-service
    ports:
      - "8009:8000"
    environment:
      - DB_HOST=postgres-ai-new
      - DB_NAME=ai_new_db
      - DB_USER=admin
      - DB_PASSWORD=changeme
      - PRODUCT_SERVICE_URL=http://product-service:8000
      - AUTH_SERVICE_URL=http://auth-service:8000
      - ORDER_SERVICE_URL=http://order-service:8000
      - REVIEW_SERVICE_URL=http://review-service:8000
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=3
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=neo4jpassword
      - DATA_DIR=/app/data
    volumes:
      - ai_new_models:/app/data/models
      - ai_new_plots:/app/data/plots
      - ai_new_chromadb:/app/data/chromadb_new
    depends_on:
      postgres-ai-new:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      product-service:
        condition: service_started
      redis:
        condition: service_healthy
    networks:
      - app-network

  # ─── API Gateway ─────────────────────────────────
  gateway:
    build: ./gateway
    ports:
      - "8000:8000"
    environment:
      - REDIS_HOST=redis
    depends_on:
      - auth-service
      - product-service
      - cart-service
      - order-service
      - payment-service
      - notification-service
      - review-service
      - ai-service
      - ai-new-service
      - redis
    networks:
      - app-network

  # ─── Frontend ────────────────────────────────────
  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - gateway
    networks:
      - app-network
    volumes:
      - ./frontend:/app
      - /app/node_modules

networks:
  app-network:
    driver: bridge

volumes:
  ai_models:
  ai_chromadb:
  ai_new_models:
  ai_new_plots:
  ai_new_chromadb:
  neo4j_data:
  neo4j_ai_data:
